name: WME plugin

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WME bundles
        run: npx webpack --config webpack.config.js --env wme="$RUNNER_TEMP/wme"

      - name: Package WME
        run: node build/wme.js "$RUNNER_TEMP/wme"

      - name: Check packaged WME
        env:
          WME_ARCHIVE: ${{ runner.temp }}/wme/carta5.wme
        run: npm run test:wme

      - name: Upload WME
        uses: actions/upload-artifact@v7
        with:
          name: carta5-wme
          path: ${{ runner.temp }}/wme/carta5.wme
          if-no-files-found: error
          retention-days: 7
