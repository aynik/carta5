name: Publish to npm
run-name: Publish ${{ github.ref_name }} to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$expected_tag" = "$GITHUB_REF_NAME"

      - name: Run contributor gate
        run: npm run check

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Read release version
        id: release
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/carta5.wme
            dist/carta5.min.js
            dist/carta5.min.js.map
            dist/carta5-worker.min.js
            dist/carta5-worker.min.js.map
            dist/carta5-worker-interface.min.js
            dist/carta5-worker-interface.min.js.map
          fail_on_unmatched_files: true
          body: |
            Changes in this release:
            - ATRAC3PLUS WME for Hi-MD recording (48, 64, 192, 256, 352 kbps). Use Carta3 for standard MD LP2/LP4.
            - Published to npm: https://www.npmjs.com/package/carta5

            Release assets include carta5.wme, the three browser JS bundles, and source maps.

            CDN URLs (this version):
            - https://unpkg.com/carta5@${{ steps.release.outputs.version }}/dist/carta5.min.js
            - https://unpkg.com/carta5@${{ steps.release.outputs.version }}/dist/carta5-worker.min.js
            - https://unpkg.com/carta5@${{ steps.release.outputs.version }}/dist/carta5-worker-interface.min.js
